name: Deploy Odoo

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DEV
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/odoo-deploy  # Assuming this is your deployment folder on the server
            git fetch origin dev
            git reset --hard origin/dev
            docker compose pull
            docker compose up -d web-dev db-dev
            docker compose restart web-dev

      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/odoo-deploy  # Assuming this is your deployment folder on the server
            git fetch origin main
            git reset --hard origin/main
            docker compose pull
            docker compose up -d web-prod db-prod
            docker compose restart web-prod
