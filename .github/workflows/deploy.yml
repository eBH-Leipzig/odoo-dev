name: Deploy to Hostinger Odoo

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Hostinger VPS and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 72.61.188.248
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /docker/odoo-dev
            git pull
            docker compose restart web
