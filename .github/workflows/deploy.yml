name: Deploy Odoo

on:
  push:
    branches:
      - main
      - dev

jobs:
  # Modultests in einer frischen Datenbank; schlagen sie fehl, wird nicht deployt.
  # Nur die Tests der eigenen Module (--test-tags), nicht die von sale, stock, ...
  test:
    runs-on: ubuntu-latest
    # Ein neuer Push ersetzt einen noch laufenden Testlauf
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    container:
      image: odoo:19.0
      options: --user root
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Modultests
        run: |
          MODULES="$(find custom_addons -mindepth 2 -maxdepth 2 -name __manifest__.py \
            -exec dirname {} \; | xargs -n1 basename | sort | paste -sd, -)"
          TAGS="$(echo "$MODULES" | sed 's/^/\//; s/,/,\//g')"
          echo "Teste: $MODULES"
          odoo --addons-path="$GITHUB_WORKSPACE/custom_addons,/usr/lib/python3/dist-packages/odoo/addons" \
            --db_host=postgres --db_user=odoo --db_password=odoo \
            -d ci_test -i "$MODULES" --test-enable --test-tags "$TAGS" --stop-after-init \
            --no-http --log-level=test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Nie zwei Deploys derselben Umgebung gleichzeitig, laufende nie abbrechen
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Deploy to DEV
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOST_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /docker/odoo-dev
            git fetch origin dev
            git reset --hard origin/dev
            bash ops/deploy.sh dev

      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOST_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /docker/odoo-prod
            git fetch origin main
            git reset --hard origin/main
            bash ops/deploy.sh prod
