name: Deploy Odoo

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DEV
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOST_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /docker/odoo-dev
            git fetch origin dev
            git reset --hard origin/dev
            docker compose pull odoo-dev odoo-db-dev
            docker compose up -d --remove-orphans odoo-dev odoo-db-dev
            docker compose restart odoo-dev

      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.HOST_IP }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /docker/odoo-dev
            git fetch origin main
            git reset --hard origin/main
            docker compose pull odoo-prod odoo-db-prod
            docker compose up -d --remove-orphans odoo-prod odoo-db-prod
            docker compose restart odoo-prod
